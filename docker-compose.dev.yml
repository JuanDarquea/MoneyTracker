services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: moneytracker
      POSTGRES_PASSWORD: moneytracker
      POSTGRES_DB: moneytracker
    ports:
      - "5433:5432"
    volumes:
      - moneytracker_pg_data:/var/lib/postgresql/data
      - ./backend/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/01-create-test-db.sql:ro

volumes:
  moneytracker_pg_data:
